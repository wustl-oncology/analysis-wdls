name: Verify WDL updates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install MiniWDL
        run: python -m pip install miniwdl
      - name: Check WDL with MiniWDL
        run: miniwdl check definitions/*.wdl --suppress CommandShellCheck
      - name: Check WDL with Sprocket
        uses: stjude-rust-labs/sprocket-action@v0.30.0
        with:
          action: check
